[project]
name = "dreamer4"
version = "0.1.0"
description = "Dreamer 4 world model (tokenizer and interactive dynamics) in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
train = ["lpips", "wandb"]
data = ["torchvision"]
interactive = ["aiohttp", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreamer4"]
